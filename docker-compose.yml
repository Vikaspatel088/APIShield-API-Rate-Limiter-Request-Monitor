version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: apishield-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: apishield-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      RATE_LIMIT_MODE: local
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
